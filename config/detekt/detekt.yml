naming:
  FunctionNaming:
    excludes: &compose-generated
      - '**/build/generated/compose/**'
    ignoreAnnotated:
      - 'Composable'

style:
  MaxLineLength:
    excludes: *compose-generated
  UnusedPrivateFunction:
    ignoreAnnotated:
      - 'Preview'

Compose:
  CompositionLocalAllowlist:
    allowedCompositionLocals:
      - 'LocalWebBrowser'
  ViewModelInjection:
    active: true
    # -- You can optionally add your own ViewModel factories here
    # viewModelFactories: hiltViewModel,potatoViewModel
    viewModelFactories: injectedViewModel
